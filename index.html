<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flip the Coin</title>

    <link rel="icon" href="./resources/favicon.ico">
    <link rel="stylesheet" href="style.css">

    <script src="script.js" defer></script>
</head>

<body>

    <main class="container">

        <h1>Flip the coin</h1>

        <p class="subtitle">Press the button to flip the coin</p>

        <section class="coin-container">

            <img
                src="./resources/heads.svg"
                alt="Heads"
                id="coin"
                class="coin"
                role="button"
            >

            <img
                src="./resources/shadow.svg"
                alt=""
                class="shadow"
            >

        </section>

        <p id="result" class="result">Heads</p>

        <button id="flip-btn">RANDOM</button>

    </main>

</body>

</html>
